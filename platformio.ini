[platformio]
default_envs = feather, waveshare
core_dir = ${sysenv.TEMP}/vibrationSensor-pio-core
build_dir = ${sysenv.TEMP}/vibrationSensor-pio-build

[env:feather]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = adafruit_feather_esp32s3_tft
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = fatfs
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit LC709203F@1.3.4
    esp32async/AsyncTCP@3.5.0
    esp32async/ESPAsyncWebServer@3.12.1
build_src_filter =
    +<*>
    -<waveshare/>
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0        ; TinyUSB: composite CDC (Serial) + MSC (src/UsbStorage.cpp)
    -D LINE_SAMPLE_HZ=200       ; MPU6050 output rate (src/Mpu6050.cpp), used by include/LineTracker.h
    ; Indoor positioning (Wi-Fi RSSI) settings, see src/indoor_positioning/IpsConfig.h:
    ; -D IPS_DEBUG=1              ; scan lists, fingerprints, distances, weights on Serial
    ; -D CALIBRATION_SIDE_M=5.0f  ; side of the calibration triangle in metres
    ; -D IPS_SCANS_PER_POINT=15   ; Wi-Fi scans per calibration point (3..30)

; Waveshare ESP32-S3-Touch-LCD-2 (SKU 29667): ESP32-S3R8 (8 MB octal PSRAM),
; 16 MB flash, 320x240 touch screen, QMI8658 IMU, TF card. The board definition
; is boards/waveshare_esp32s3_touch_lcd_2.json (PlatformIO has none for it; the
; generic dev kit's USB mode 1 and 8 MB flash are not wanted). The app lives in
; src/waveshare; network, web page, Wi-Fi scan and USB storage are shared with Feather.
[env:waveshare]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = waveshare_esp32s3_touch_lcd_2
framework = arduino
board_build.partitions = partitions_waveshare.csv
board_build.filesystem = fatfs
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    esp32async/AsyncTCP@3.5.0
    esp32async/ESPAsyncWebServer@3.12.1
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0        ; TinyUSB: composite CDC (Serial) + MSC (src/UsbStorage.cpp)
    -D LINE_SAMPLE_HZ=200        ; the line tracker runs at 200 Hz (the IMU is resampled to it)
    -Isrc/waveshare
build_src_filter =
    -<*>
    +<waveshare/>
    +<Network.cpp>
    +<WebLink.cpp>
    +<WifiScan.cpp>
    +<UsbStorage.cpp>
