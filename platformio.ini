[platformio]
default_envs = waveshare
core_dir = ${sysenv.TEMP}/vibrationSensor-pio-core
build_dir = ${sysenv.TEMP}/vibrationSensor-pio-build

; Waveshare ESP32-S3-Touch-LCD-2 (SKU 29667): ESP32-S3R8 (8 MB octal PSRAM),
; 16 MB flash. There is no PlatformIO board definition for it, so the generic
; ESP32-S3 dev kit is used with the memory settings overridden.
[env:waveshare]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
; The Wi-Fi indoor positioning prototype and its screen belong to the earlier
; Feather version and are not built for this board (the code stays in the tree).
build_src_filter =
    +<*>
    -<indoor_positioning/>
    -<NavigationScreen.cpp>
    -<NavigationScreen.h>
